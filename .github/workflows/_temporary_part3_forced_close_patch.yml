name: Temporary part3 forced-close patch

on:
  push:
    branches:
      - fix/871-android-gatt-lifecycle-integration
    paths:
      - .github/workflows/_temporary_part3_forced_close_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/871-android-gatt-lifecycle-integration
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/_temporary_part3_patch.py
      - name: Commit patch
        run: |
          rm .github/_temporary_part3_patch.py
          rm .github/workflows/_temporary_part3_forced_close_patch.yml
          git config user.name ODevStudio
          git config user.email ODevStudio@proton.me
          git add -A
          git diff --cached --check
          git commit -m 'fix(android): bound missing disconnect callbacks'
          git push origin HEAD:fix/871-android-gatt-lifecycle-integration
