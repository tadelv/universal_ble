name: Temporary part3 legacy fixture fix

on:
  push:
    branches:
      - fix/871-android-gatt-lifecycle-integration
    paths:
      - .github/workflows/_temporary_part3_testfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/871-android-gatt-lifecycle-integration
          fetch-depth: 0
      - name: Apply fixture fix
        run: python3 .github/_temporary_part3_testfix.py
      - name: Commit fixture fix
        run: |
          rm .github/_temporary_part3_testfix.py
          rm .github/workflows/_temporary_part3_testfix.yml
          git config user.name ODevStudio
          git config user.email ODevStudio@proton.me
          git add -A
          git diff --cached --check
          git commit -m 'test(android): model disconnect fallback scheduling'
          git push origin HEAD:fix/871-android-gatt-lifecycle-integration
